[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The DISTRIBUTION name is `mwvo-fita`; the IMPORT name stays `fita`.
#
# `fita` on PyPI is taken by an unrelated project (v0.0.1), as are `fitb`,
# `fitr` and `fito`. The FIT(a-z) namespace cannot be controlled and bulk
# registering it would be squatting, so the principal accepted the `mwvo-`
# prefix on 2026-08-02. Distribution and import names differing is ordinary
# (pillow/PIL, scikit-learn/sklearn), and renaming the module would break every
# existing notebook for no gain.
name = "mwvo-fita"
# 1.5.2: extend the float32 gate to the HDF5 and Zarr writers. 1.5.1 enforced the
# ruling in io.py (FITS) only, and both other backends went on accepting float64.
# FITAVER stays 1.5 throughout -- this enforces an existing MUST (S6.1) and does
# not change the format, so no FITAVER increment is due under S13.
version = "1.5.2"
description = "Flexible Image Transfer Alpha — multi-wavelength FITS cube with per-layer alpha, blend modes, and IrenBLink pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Ignacio A. Cisneros", email = "astroobserver88@gmail.com" },
]
maintainers = [
    { name = "Ignacio A. Cisneros", email = "astroobserver88@gmail.com" },
]
keywords = ["astronomy", "fits", "imaging", "multi-wavelength", "compositing",
            "virtual-observatory", "obscore", "stereoscopy", "interstellar-medium"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Multimedia :: Graphics",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core runtime dependencies — always installed
dependencies = [
    "numpy>=1.22",
    "astropy>=5.0",
]

# NOTE the ordering: [project.urls] is a SUB-TABLE, so every plain key of
# [project] must appear ABOVE it. Placing it earlier silently absorbs the keys
# that follow -- `dependencies` became `project.urls.dependencies` and the build
# failed with "must be string". TOML section order is load-bearing.
#
# Without these the PyPI page links to nothing, and FITA's whole claim rests on
# the normative standard and the conformance corpus, neither of which a reader
# could otherwise find.
[project.urls]
Homepage      = "https://github.com/Astroobserver11/MWVO_FITA"
Repository    = "https://github.com/Astroobserver11/MWVO_FITA"
Documentation = "https://github.com/Astroobserver11/MWVO_FITA/blob/main/FITA_FORMAT_STANDARD.RATIFIED-v1.2.md"
Changelog     = "https://github.com/Astroobserver11/MWVO_FITA/blob/main/CHANGELOG.md"
"Conformance corpus" = "https://github.com/Astroobserver11/MWVO_FITA/tree/main/corpus"
Issues        = "https://github.com/Astroobserver11/MWVO_FITA/issues"

[project.optional-dependencies]
# Photoshop PSD import (format-kernel feature — no uranodyne needed)
psd = [
    "psd-tools>=1.9",
    "Pillow>=9.0",
]
# The URANODYNE science stack, as an OPT-IN extra:
#     pip install "mwvo-fita[uranodyne] @ git+https://github.com/Astroobserver11/MWVO_FITA.git"
#
# It stays a SEPARATE distribution and is NOT a core dependency: the format
# kernel must remain installable and testable on its own, and `fita` never
# imports `uranodyne` (the arrow only ever points the other way).
#
# Three things to know before editing this block:
#
#  1. CYCLE. uranodyne's own pyproject declares `mwvo-fita>=1.5.0`, so this
#     extra closes a dependency cycle. pip resolves it because installing from
#     a direct URL pins the name `mwvo-fita` to THIS tree (version 1.5.0),
#     which satisfies uranodyne's requirement from the resolution set without
#     ever querying PyPI. Drop the version below 1.5.0 and the cycle stops
#     resolving.
#
#  2. THE URL IS PyPI-ILLEGAL. PyPI refuses any upload whose metadata carries a
#     direct reference ("Can't have direct dependency"). So this line is what
#     makes the GitHub install work *and* what would make `twine upload` to
#     PyPI fail. Before publishing, either publish uranodyne first and change
#     this to a plain `uranodyne>=1.0.0`, or drop the extra. This is a gate on
#     publication, not a defect.
#
#  3. NOT IN `dev`, on purpose. CI installs `dev`; an extra that reached for an
#     unpublished uranodyne previously failed the build on every platform. The
#     test suite keeps its `pytest.importorskip("uranodyne")` guards so the
#     kernel's own gate never depends on this extra being present.
uranodyne = [
    "uranodyne @ git+https://github.com/Astroobserver11/uranodyne.git@main",
]

# Development / testing of the format kernel only.
dev = [
    "pytest>=7",
    "pytest-cov",
    "scipy>=1.8",
    "astroquery>=0.4.7",
    "reproject>=0.9",
    "photutils>=1.5",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
]

[project.scripts]
fita = "fita.cli:main"

[tool.setuptools.packages.find]
# Restrict discovery to the fita package.  Without `include`, a bare
# where=["."] scan of the repo root also picks up demo_output, m27_products,
# skyview_cache, tests AND the sibling uranodyne package, shipping all of them
# inside the fita wheel as importable top-level names.
where = ["."]
include = ["fita*"]

[tool.setuptools.package-data]
fita = [
    "instrument_db/*.json",   # instrument calibration database
    "ai/*.json",              # FITA_FORMAT_CARD.json — the AI format card
]

[tool.pytest.ini_options]
markers = [
    "slow: regenerates the whole corpus; deselect with -m 'not slow'",
]
