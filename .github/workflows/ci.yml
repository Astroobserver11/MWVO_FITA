name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # Windows runners default to pwsh, where a bash heredoc does not parse.
    # One shell everywhere keeps the steps honest across the matrix.
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: the CRLF/binary-file hazard that would
        # have corrupted the corpus is Windows-specific, and the reference
        # implementation is developed there.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # A module-level `pytest.importorskip` reports ONE skip per module however
      # many tests that module holds, so a matrix cell missing an optional
      # dependency silently collects fewer tests and still reports green. The
      # passed count moves and nothing says the denominator moved with it.
      # Asserting a floor makes the denominator visible. Raise KERNEL_FLOOR
      # deliberately when tests are added; never lower it to make CI pass.
      - name: Collected-count floor (the denominator must be visible)
        env:
          KERNEL_FLOOR: "253"
        run: |
          collected=$(python -m pytest tests/ -q --collect-only 2>/dev/null \
                      | grep -Eo '^[0-9]+ tests collected' | grep -Eo '^[0-9]+')
          echo "collected=$collected  floor=$KERNEL_FLOOR"
          if [ -z "$collected" ] || [ "$collected" -lt "$KERNEL_FLOOR" ]; then
            echo "::error::collected $collected < floor $KERNEL_FLOOR -- tests"\
                 "went missing without failing. Check for a module-level"\
                 "importorskip hiding an absent optional dependency."
            exit 1
          fi

      - name: Test suite
        run: python -m pytest tests/ -q -rs --tb=short

      - name: Installation is usable from an unrelated directory
        # The IrenBLink failure: an install that only resolves when the working
        # directory happens to be the repo root. Run from elsewhere on purpose.
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import sys
          from fita.doctor import doctor
          sys.exit(1 if doctor() >= 2 else 0)
          "


      - name: Corpus validates (bytes compared only if the toolchain matches)
        run: python corpus/build_corpus.py --verify

      - name: Corpus survives checkout intact
        # Proves .gitattributes is doing its job: a text-mode checkout would
        # shift every 2880-byte FITS block boundary.
        run: |
          python - <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          m = json.loads(Path("corpus/MANIFEST.json").read_text())
          bad = [e["file"] for e in m["files"]
                 if hashlib.sha256((Path("corpus") / e["file"]).read_bytes()).hexdigest()
                 != e["sha256"]]
          if bad:
              sys.exit("corpus corrupted by checkout: " + ", ".join(bad))
          print("corpus intact: %d files" % len(m["files"]))
          EOF

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
